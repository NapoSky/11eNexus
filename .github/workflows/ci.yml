name: Validate
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm audit --prod --audit-level=high
      - run: docker build --pull --target test --tag 11enexus:test .
      - run: docker build --pull --target runtime --tag 11enexus:ci .
      - run: docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --memory=1g --pids-limit=128 --cap-drop ALL --security-opt no-new-privileges:true 11enexus:ci node scripts/check-runtime.mjs
      - run: docker run --rm --network none 11enexus:ci node dist/cli.js help
      - run: docker image save --output /tmp/11enexus-ci-image.tar 11enexus:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          input: /tmp/11enexus-ci-image.tar
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
